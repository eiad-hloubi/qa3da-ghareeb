<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة قعدة غريب</title>
<style>@font-face{font-family:Changa;font-weight:400;src:url(fonts/changa-arabic-400-normal.woff2)}@font-face{font-family:Changa;font-weight:800;src:url(fonts/changa-arabic-800-normal.woff2)}</style>
<style>:root{--p:#F5EEE2;--i:#1A1714;--c:#FFFDF8}@media(prefers-color-scheme:dark){:root{--p:#17141D;--i:#F5EEE2;--c:#25202D}}body{margin:0;background:var(--p);color:var(--i);font-family:Changa,sans-serif}main{max-width:760px;margin:0 auto;padding:20px 16px}h1{font-family:Changa;font-weight:800}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.k{background:var(--c);border:3px solid #1A1714;border-radius:14px;box-shadow:4px 4px 0 #1A1714;padding:14px}.k b{display:block;font-family:Changa;font-size:34px;font-weight:400}table{width:100%;border-collapse:collapse;margin-top:12px}td,th{padding:8px;border-bottom:1px dashed #888;text-align:right}input,button{font:inherit;padding:8px 12px;border:2px solid #1A1714;border-radius:10px}button{background:#F2B632;cursor:pointer}</style></head>
<body><main><h1>لوحة إدارة «قعدة غريب»</h1><p style="margin:0;color:#888">أرقام فقط، دون أسماء أو صور</p><div class="g" id="s"></div>
<h2 style="font-family:Changa;font-weight:800;margin-top:26px">الجلسات النشطة</h2>
<div><input id="k" placeholder="مفتاح الإدارة (ADMIN_KEY)"> <button onclick="rooms()">اعرض الجلسات</button></div><table id="t"></table></main>
<script>
const L={rooms:'الجلسات المفتوحة',games:'الألعاب المكتملة والمبدوءة',players:'اللاعبون',rounds:'الأسئلة المطروحة',strangerWins:'فوز الغريب',citizenWins:'كشف الغريب',stopped:'ألعاب أُغلقت قبل نهايتها',activeRooms:'الجلسات النشطة الآن',onlinePlayers:'المتصلون الآن'};
fetch('/stats').then(r=>r.json()).then(d=>{s.innerHTML=Object.keys(L).map(k=>`<div class="k">${L[k]}<b>${d[k]||0}</b></div>`).join('')+`<div class="k" style="grid-column:1/-1">أكثر المواضيع: ${(d.topCategories||[]).map(x=>x[0]+' ('+x[1]+')').join(' · ')||'—'}</div>`});
function rooms(){fetch('/admin/rooms?key='+encodeURIComponent(k.value)).then(r=>r.json()).then(d=>{if(d.error)return t.innerHTML='<tr><td>المفتاح غير صحيح</td></tr>';t.innerHTML='<tr><th>الرمز</th><th>المدة (دقيقة)</th><th>المرحلة</th><th>اللاعبون</th><th>الألعاب</th><th></th></tr>'+d.map(r=>`<tr><td>${r.code}</td><td>${r.minutes}</td><td>${r.phase}</td><td>${r.online}/${r.players}</td><td>${r.games}</td><td><button onclick="cl('${r.code}')">إغلاق</button></td></tr>`).join('')})}
function cl(c){fetch('/admin/close/'+c+'?key='+encodeURIComponent(k.value),{method:'POST'}).then(rooms)}
</script></body></html>
